[pytest]
DJANGO_SETTINGS_MODULE = config.settings
pythonpath = .
testpaths = tests
# tests/ se monta en solo lectura: no se escribe caché de pytest.
addopts = -p no:cacheprovider --strict-markers
markers =
    humo: prueba de humo del entorno
    catalogo: ficha, trazabilidad y conteos del catálogo de servicios
    p01: prueba P01 del enunciado
    p02: prueba P02 del enunciado
    p03: prueba P03 del enunciado
    p04: prueba P04 del enunciado
    p05: prueba P05 del enunciado
    p06: prueba P06 del enunciado
    p07: prueba P07 del enunciado
    p08: prueba P08 del enunciado
    p09: prueba P09 del enunciado
    p10: prueba P10 del enunciado
    p11: prueba P11 del enunciado
    p12: prueba P12 del enunciado
